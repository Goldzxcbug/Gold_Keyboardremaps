name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI to build
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      publish_release:
        description: Create a GitHub Release and attach the module ZIP
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean
      release_tag:
        description: Optional release tag; leave empty to generate one
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      ANDROID_PLATFORM: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      # The consumer app lives in another repository and the identity check
      # compares fn_remap.c against it. Without this the check reports SKIP --
      # it does not quietly pass -- so a run that never had a token is visibly
      # not the same as a run that verified anything.
      - name: Check out the Anland consumer app
        if: ${{ vars.ANLAND_REPO != '' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.ANLAND_REPO }}
          token: ${{ secrets.ANLAND_TOKEN }}
          path: anland

      - name: Run host tests
        run: |
          set -eu
          status=0
          for t in tests/test_*.sh; do
            echo "== $t"
            sh "$t" || status=1
          done
          exit $status

      - name: Build module
        id: package
        env:
          TARGET_ABI: ${{ inputs.abi }}
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ABI" in
            arm64-v8a)
              target_triple=aarch64-linux-android
              expected_machine=aarch64
              ;;
            armeabi-v7a)
              target_triple=armv7a-linux-androideabi
              expected_machine=ARM
              ;;
            x86_64)
              target_triple=x86_64-linux-android
              expected_machine=x86-64
              ;;
            *)
              echo "Unsupported ABI: $TARGET_ABI" >&2
              exit 2
              ;;
          esac

          ndk_root="$ANDROID_HOME/ndk/$NDK_VERSION"
          toolchain="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin"
          compiler="$toolchain/${target_triple}${ANDROID_API}-clang"
          android_jar="$ANDROID_HOME/platforms/android-$ANDROID_PLATFORM/android.jar"
          d8="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/d8"

          test -x "$compiler"
          test -f "$android_jar"
          test -x "$d8"

          rm -rf build
          mkdir -p build/java-classes build/module/bin

          "$compiler" -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -fPIE -pie \
            fn_remap.c -o build/module/bin/fn-remap
          file build/module/bin/fn-remap | grep -F "$expected_machine"

          javac -source 8 -target 8 -cp "$android_jar" -d build/java-classes \
            ColorOS.java
          "$d8" --min-api "$ANDROID_API" --lib "$android_jar" \
            --output build/module/bin/coloros-window-launcher.jar \
            build/java-classes/gold/keyboardremaps/ColorOS.class
          unzip -l build/module/bin/coloros-window-launcher.jar | grep -F 'classes.dex'

          install -m 0644 module.prop config.conf build/module/
          install -m 0755 service.sh action.sh build/module/
          install -m 0755 keyboardctl build/module/bin/keyboardctl
          cp -a webroot build/module/

          archive="build/Gold_Keyboardremaps-${TARGET_ABI}.zip"
          (
            cd build/module
            zip -q -r -9 "../$(basename "$archive")" .
          )
          unzip -t "$archive"
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Calculate release metadata
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          module_version="$(awk -F= '$1 == "version" { print $2; exit }' module.prop)"
          if [ -z "$module_version" ]; then
            echo "module.prop does not define version" >&2
            exit 1
          fi
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="v${module_version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload module artifact
        uses: actions/upload-artifact@v6
        with:
          name: Gold_Keyboardremaps-${{ inputs.abi }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_options=()
          if [ "$PRERELEASE" = "true" ]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Gold Keyboard Remaps $RELEASE_TAG" \
            --generate-notes \
            "${release_options[@]}"
