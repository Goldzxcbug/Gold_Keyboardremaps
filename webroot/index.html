<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>Gold Keyboard Remaps</title>
  <link rel="stylesheet" href="style.css?v=20260815-app-mapping-3">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Gold_Keyboardremaps</p>
      <h1>Gold Keyboard Remaps</h1>
    </div>
    <div class="topbar-actions">
      <button id="themeToggle" class="button ghost theme-toggle" type="button" title="切换颜色主题">主题：跟随系统</button>
      <div id="statusPill" class="status-pill pending"><span></span><strong>读取中</strong></div>
    </div>
  </header>

  <main>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <section class="panel" aria-labelledby="devicesTitle">
      <div class="section-head">
        <div>
          <p class="section-kicker">输入控制</p>
          <h2 id="devicesTitle">输入节点</h2>
        </div>
        <button id="refreshDevices" class="button secondary" type="button">刷新节点</button>
      </div>
      <div class="auto-row">
        <label class="switch-line">
          <input id="autoSelect" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
          <span>自动选择外接物理键盘（支持多品牌）</span>
        </label>
        <span id="deviceCount" class="muted">0 个节点</span>
      </div>
      <div id="deviceList" class="device-list" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="mappingTitle">
      <div class="section-head mapping-head">
        <div>
          <p class="section-kicker">事件转换</p>
          <h2 id="mappingTitle">按键映射</h2>
        </div>
        <div class="button-row">
          <button id="addSingle" class="button secondary" type="button">添加单键</button>
          <button id="addCombo" class="button secondary" type="button">添加组合</button>
        </div>
      </div>
      <p id="fnHint" class="mapping-hint" role="status"></p>
      <div id="mappingList" class="mapping-list"></div>
      <div id="emptyMappings" class="empty-state" hidden>暂无映射规则</div>
    </section>

    <section id="editor" class="panel editor" hidden aria-labelledby="editorTitle">
      <div class="section-head">
        <div>
          <p class="section-kicker">规则编辑</p>
          <h2 id="editorTitle">新建映射</h2>
        </div>
        <button id="cancelEdit" class="button ghost" type="button">取消</button>
      </div>
      <div class="editor-grid">
        <label class="field">
          <span class="field-heading"><span>输入键</span><button id="captureSource" class="button ghost capture-button" type="button">捕获按键 5 秒</button></span>
          <div id="captureStatus" class="capture-status" role="status" aria-live="polite">捕获状态：等待开始。点击上方按钮后，在 5 秒内按下外接键盘按键。</div>
          <select id="sourceKeys" multiple size="7"></select>
          <small>单键模式识别到首个按键即结束；组合模式会完整监听 5 秒，可连续捕获多个按键。捕获只监听已选外接键盘。</small>
        </label>
        <div class="rule-arrow" aria-hidden="true">→</div>
        <label id="keyTargetField" class="field">
          <span class="field-heading"><span>输出键</span><span class="capture-actions"><button id="openAppAction" class="button ghost capture-button" type="button">打开应用</button><button id="keyboardView" class="button ghost capture-button" type="button">键盘视图</button><button id="captureTarget" class="button ghost capture-button" type="button">捕获按键 5 秒</button></span></span>
          <select id="targetKeys" multiple size="7"></select>
          <small>多项输出会同时按下，松开时反向释放</small>
        </label>
        <label id="appTargetField" class="field" hidden>
          <span class="field-heading"><span>打开应用</span><span class="capture-actions"><button id="useKeyAction" class="button ghost capture-button" type="button">使用按键输出</button><button id="refreshApps" class="button ghost capture-button" type="button">刷新应用</button></span></span>
          <input id="appSearch" class="app-search" type="search" placeholder="搜索应用名称或包名" autocomplete="off">
          <select id="appTarget" size="7" aria-label="选择要打开的应用"></select>
          <label class="check-line"><input id="appFreeform" type="checkbox"><span>以小窗形式打开</span></label>
          <label class="check-line"><input id="appCloseOnRepeat" type="checkbox"><span>再次按下时关闭 App（保留后台）</span></label>
          <small>小窗模式取决于系统与应用是否支持；不支持时可能由系统以普通窗口打开。</small>
        </label>
      </div>
      <div class="editor-actions">
        <span id="editorMode" class="mode-label">单键映射</span>
        <button id="saveRule" class="button primary" type="button">加入规则</button>
      </div>
    </section>

    <div id="keyboardDialog" class="keyboard-dialog" role="dialog" aria-modal="true" aria-labelledby="keyboardDialogTitle" hidden>
      <div class="keyboard-dialog-card">
        <div class="section-head">
          <div>
            <p class="section-kicker">输出选择</p>
            <h2 id="keyboardDialogTitle">全键盘按键</h2>
          </div>
          <button id="closeKeyboardView" class="button ghost" type="button">关闭</button>
        </div>
        <p class="mapping-hint">点击下方主字符选择单键；点击键帽上方符号会自动选择 Shift 和对应主键，支持多选并同步到输出键列表。</p>
        <div id="keyboardLayout" class="keyboard-layout"></div>
        <div class="keyboard-dialog-footer">
          <span id="keyboardSelection" class="muted">尚未选择输出键</span>
          <button id="keyboardDone" class="button primary" type="button">完成</button>
        </div>
      </div>
    </div>

    <footer class="footer-bar">
      <span id="lastApplied" class="muted">尚未应用更改</span>
      <div class="footer-actions">
        <button id="restoreDefaults" class="button danger" type="button">恢复默认</button>
        <button id="saveConfig" class="button primary" type="button">保存并应用</button>
      </div>
    </footer>
  </main>
  <script type="module" src="app.js?v=20260815-normal-toggle-1"></script>
</body>
</html>
